name: EduAssist-AI CI/CD

on:
  push:
    branches: [ "staging", "uat", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode dari Repository
        uses: actions/checkout@v4
        
      - name: Siapkan Lingkungan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Library
        run: pip install -r requirements.txt
        
      - name: Jalankan Pengujian Otomatis
        run: python -m pytest

  deploy-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode dari Repository (Wajib ditarik lagi)
        uses: actions/checkout@v4

      - name: Build Docker untuk Staging
        run: |
          echo "🚀 Deploying to Staging Server (Internal Testing)..."
          docker build -t eduassist:staging .
          echo "✅ Staging Deployment Successful!"

  deploy-uat:
    needs: build-and-test
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode dari Repository
        uses: actions/checkout@v4

      - name: Simulasi Deploy ke UAT
        run: |
          echo "👥 Deploying to UAT (User Acceptance Testing)..."
          echo "⚠️ Menunggu validasi Asisten Lab..."
          echo "✅ UAT Deployment Successful!"

  deploy-production:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode dari Repository
        uses: actions/checkout@v4

      - name: Build & Deploy ke Production
        run: |
          echo "🏛️ Simulating Deployment to Production Environment!"
          docker build -t eduassist:latest .
          echo "🎉 EduAssist-AI Bot is LIVE for students!"